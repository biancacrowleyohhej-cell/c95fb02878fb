version: 2.1

jobs:
  chaoslatency:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set fault
          command: |
            printf 'latency 200ms\n' > chaos.cfg
      - run:
          name: Build fault injector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target chaoslatency -j2
      - run:
          name: Inject latency fault
          command: LIONSS_LP=1 ./build/chaoslatency --conf chaos.cfg --target svc-a
  dedupeBlock:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point volume
          command: |
            printf 'vol /mnt/v\n' > dedup.cfg
      - run:
          name: Build dedup engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dedupeBlock -j2
      - run:
          name: Deduplicate blocks
          command: LIONSS_LP=1 ./build/dedupeBlock --conf dedup.cfg --block 64k
  BrambleCreek:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load watershed
          command: |
            printf 'streams 6\n' > creek.cfg
      - run:
          name: Build flow network
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target BrambleCreek -j2
      - run:
          name: Route bramblecreek
          command: LIONSS_LP=1 ./build/BrambleCreek --config creek.cfg --rain 20
  sdi12-poll:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
